{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Restaurant</title>

    <link rel="stylesheet" href="{% static 'update_restaurant.css' %}">
</head>

<body>

<div class="container">

    <h1>🍽 Update Restaurant</h1>

    <p>Edit restaurant details below</p>

    <form action="{% url 'update_restaurant' restaurant.id %}" method="post">

        {% csrf_token %}

        <label>Restaurant Name</label>
        <input type="text" name="name" value="{{ restaurant.name }}" required>

        <label>Picture URL</label>
        <input type="text" name="picture" value="{{ restaurant.picture }}" required>

        <label>Cuisine</label>
        <input type="text" name="cuisine" value="{{ restaurant.cuisine }}" required>

        <label>Rating</label>
        <input type="number"
               name="rating"
               min="0"
               max="5"
               step="0.5"
               value="{{ restaurant.rating }}"
               required>

        <button type="submit" class="btn">
            ✏️ Update Restaurant
        </button>

    </form>

</div>

</body>
</html>
