{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>MealMate - Sign In</title>
    <link rel="stylesheet" href="{% static 'signinn.css' %}">
</head>
<body>

<div class="container">

    <div class="logo">🍔</div>

    <h1>MealMate!</h1>
    <p>Welcome Back</p>

    <form action="signin" method="post">
        {% csrf_token %}

        <input type="text" name="username" placeholder="Username" required>

        <input type="password" name="password" placeholder="Password" required>

        <button type="submit" class="btn">
            SIGN IN
        </button>
    </form>

    <div class="footer">
        Don't have an account?
        <a href="open_signup">Sign Up</a>
    </div>

</div>

</body>
</html>
