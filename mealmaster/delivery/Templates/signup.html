{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MealMate - Sign Up</title>

    <link rel="stylesheet" href="{% static 'signupp.css' %}">
</head>
<body>

<div class="container">

    <div class="logo">🍔</div>

    <h1>MealMate!</h1>

    <p>Create Your Account</p>

    <form action="{% url 'signup' %}" method="POST">

        {% csrf_token %}

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <input
            type="email"
            name="email"
            placeholder="Email Address"
            required
        >

        <input
            type="tel"
            name="mobile"
            placeholder="+91 Mobile Number"
            pattern="[0-9]{10}"
            maxlength="10"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm Password"
            required
        >

        <textarea
            name="address"
            placeholder="Address"
            rows="4"
            required
        ></textarea>

        <button type="submit" class="btn">
            SIGN UP
        </button>

    </form>

    <div class="footer">
        Already have an account?
        <a href="open_signin">Sign In</a>
    </div>

</div>

</body>
</html>
